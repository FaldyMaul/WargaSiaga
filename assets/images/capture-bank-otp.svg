      <text x="184" y="518" fill="#243442" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="560"><tspan x="184" dy="0">Sebutkan kode OTP yang</tspan><tspan x="184" dy="45">baru masuk agar rekening</tspan><tspan x="184" dy="45">tidak diblokir.</tspan></text>
      <text x="638" y="625" text-anchor="end" fill="#7a8893" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">10.42</text>
